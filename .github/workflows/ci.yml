name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    container: ruby:${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gem install --no-document jwt
      - run: gem install --no-document minitest -v '~> 5.0'
      - run: ruby test_authfi.rb
      - name: The gem builds, installs and loads
        run: |
          gem build authfi.gemspec
          gem install --local --no-document authfi-*.gem
          cd / && ruby -e "require 'authfi'; puts AuthFI::VERSION"
